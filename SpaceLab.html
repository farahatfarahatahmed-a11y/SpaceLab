<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخطط الدورة الزراعية للفلاح</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap&display=swap" rel="stylesheet">
<style>
:root{--bg:rgb(244,247,239);--card:rgba(255,255,255,.97);--tx:rgb(20,34,18);--mu:rgb(62,78,56);--pr:rgb(30,132,56);--pr2:rgb(220,242,212);--bd:rgb(184,204,170);--ac:rgb(196,118,6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:rgb(16,26,22);--card:rgba(14,26,22,.94);--tx:rgb(240,247,236);--mu:rgb(196,210,188);--pr:rgb(106,201,115);--pr2:rgb(30,58,38);--bd:rgb(56,84,64);--ac:rgb(236,178,66);color-scheme:dark}}
:root[data-theme="dark"]{--bg:rgb(16,26,22);--card:rgba(14,26,22,.94);--tx:rgb(240,247,236);--mu:rgb(196,210,188);--pr:rgb(106,201,115);--pr2:rgb(30,58,38);--bd:rgb(56,84,64);--ac:rgb(236,178,66);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#06141a;color:var(--tx);font-family:Tajawal,Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8;font-size:17px}
header{background:var(--pr);color:#fff;padding:28px 16px;text-align:center}
header h1{margin:0 0 6px;font-size:1.7rem}header p{margin:0;opacity:.9}
main{max-width:900px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.2rem;color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-weight:600;margin-bottom:4px;font-size:.95rem}
select,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
select:disabled{opacity:.5}
button.go{width:100%;margin-top:14px;padding:13px;background:var(--pr);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
:root[data-theme="dark"] button.go{color:#10200e}
.pri{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.pri label{border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center;margin:0}
.pri input{width:80px;text-align:center}.pri label:has(input:checked){background:none}
.pri label:has(input:checked){background:var(--pr2);border-color:var(--pr)}
.yr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.yr b{background:var(--pr);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{border:2px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--pr)}
.opt.sel{border-color:var(--pr);background:var(--pr2)}
.opt h3{margin:0 0 6px;font-size:1.2rem;font-weight:700;line-height:1.9;color:var(--tx);overflow:visible;display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:.78rem;padding:2px 9px;border-radius:20px;background:var(--pr);color:#fff;margin-inline-start:auto;white-space:nowrap;line-height:1.6;flex:none;order:2}
.badge.m{background:var(--ac)}
.opt ul{margin:6px 0 0;padding-inline-start:20px;color:var(--tx);font-size:.97rem;line-height:1.9}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.plan div{background:var(--pr2);border-radius:12px;padding:12px;text-align:center}
.plan strong{display:block;font-size:1.25rem;color:var(--pr)}
.note{color:var(--mu);font-size:.92rem}
button.go:hover{filter:brightness(1.1)}
select:focus,input:focus{outline:2px solid var(--pr);outline-offset:1px}
header h1{text-shadow:0 2px 8px rgba(0,0,0,.45)}
header p{text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sl{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.sc{display:flex;flex-direction:column;align-items:center;width:92px;text-align:center}
.vs{position:relative;width:66px;height:170px;border-radius:24px;background:rgb(74,74,74);overflow:hidden;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.vs .fl{position:absolute;bottom:0;left:0;right:0;background:rgb(255,255,255);height:25%}
.vs .ic{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:1.5rem;line-height:1;pointer-events:none}
.pv{margin-top:6px;font-size:1.1rem;color:var(--pr)}
.nm{font-size:.85rem;color:var(--tx);line-height:1.4}
.tt{width:100%;text-align:center;margin:0}
header{position:relative}
.lg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:5px 16px;font:inherit;font-weight:700;cursor:pointer}
.lg:hover{background:rgba(255,255,255,.3)}
footer{text-align:center;color:rgb(235,242,230);font-size:.85rem;padding:6px 16px 28px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
label{line-height:1.6}
.hide{display:none}

  if(c[4]!="بقولية"&&p[4]=="بقولية"){s+=12;r.push(["rUse",prev])}
  if(p[4]!=c[4])r.push(["rBrk",prev]);
 }
 if(c[6]==2){s+=(x.om<2?12:3);if(x.om<2)r.push(["rOM"])}
 if(c[3]==3&&x.rain<80)r.push(["rHigh"]);
 if(c[8].includes(x.soil))r.push(["rSoil"]);
 return[s,r];
}
function topN(x,prev,n){return C.map((_,i)=>[i,...score(i,x,prev)]).sort((a,b)=>b[1]-a[1]).slice(0,n)}

  if(!ws[y])ws[y]={...ws[y-1]};const prev=y==0?X.last:pick[y-1];

   h+='<div class="opt'+(pick[y]===i?' sel':'')+'" data-y="'+y+'" data-i="'+i+'"><h3>'+cn(i)+'<span class="badge'+(k==0?'':' m')+'">'+lv+'</span></h3><ul>'+r.slice(0,3).map(q=>'<li>'+tr(q[0],...q.slice(1))+'</li>').join("")+'</ul></div>';
  });

 }

 }
 o.innerHTML=h;
 for(let y=0;y<X.yrs&&y<=pick.length;y++){sliders($("sl"+y),ws[y],()=>{pick=pick.slice(0,y);ws.length=y+1;render()})}
